name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: Program seed is in sync with content/programs
        run: npx tsx scripts/gen-seed-programs.ts && git diff --exit-code supabase/seed_programs.sql
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, seeds, smoke test and RLS privacy suite on plain Postgres (Supabase objects stubbed)
        run: |
          for f in supabase/tests/supabase_stubs.sql supabase/migrations/*.sql supabase/seed.sql supabase/seed_programs.sql supabase/seed_demo.sql \
                   supabase/tests/smoke.sql supabase/tests/rls_privacy.sql; do
            echo "== $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
